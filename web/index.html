<!DOCTYPE html>
<html>
<head>
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>USA Weather: Live Radar, NOAA Alerts & Accurate Forecast</title>
  <meta name="description" content="USA Weather provides live NOAA radar maps, severe storm and hurricane alerts, accurate hourly & 7-day local forecasts, UV index, and air quality across all 50 US states.">
  <meta name="keywords" content="USA weather, US radar, live weather radar, NOAA weather alerts, storm tracker, hurricane tracker, rain radar, hourly forecast, US air quality, weather forecast today">
  <meta name="author" content="Apps-Tools">
  <meta name="robots" content="index, follow">
  <meta name="theme-color" content="#0A0E2E">

  <!-- Open Graph / Facebook / WhatsApp -->
  <meta property="og:type" content="website">
  <meta property="og:title" content="USA Weather: Live Radar, NOAA Alerts & Accurate Forecast">
  <meta property="og:description" content="Get real-time NOAA weather radar, severe storm alerts, precise hourly forecasts, air quality, and UV index for every US city.">
  <meta property="og:image" content="icons/Icon-512.png">
  <meta property="og:site_name" content="USA Weather">

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="USA Weather: Live Radar, NOAA Alerts & Accurate Forecast">
  <meta name="twitter:description" content="Real-time US Doppler radar, NOAA storm warnings, 7-day weather forecasts & air quality alerts.">
  <meta name="twitter:image" content="icons/Icon-512.png">

  <!-- PWA / iOS meta tags -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="USA Weather">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>
  <link rel="manifest" href="manifest.json">

  <!-- Schema.org Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "SoftwareApplication",
    "name": "USA Weather",
    "operatingSystem": "iOS, Android, Web",
    "applicationCategory": "WeatherApplication",
    "offers": {
      "@type": "Offer",
      "price": "0",
      "priceCurrency": "USD"
    },
    "description": "Accurate real-time USA weather forecast, live Doppler radar, severe storm and hurricane alerts, air quality index, and UV index for all United States locations.",
    "aggregateRating": {
      "@type": "AggregateRating",
      "ratingValue": "4.8",
      "ratingCount": "1250"
    }
  }
  </script>

  <!-- Google Maps JavaScript API (for web radar) -->
  <script src="https://maps.googleapis.com/maps/api/js?key=AIzaSyBCbRqBJBzqc6sBBPiWAwUmkpXbYU8LJkE" async defer></script>

  <style>
    /* Prevent white flash during load */
    html, body {
      background-color: #0A0E2E;
      margin: 0;
      padding: 0;
      height: 100%;
    }
    /* Loading indicator */
    #loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: linear-gradient(135deg, #0A0E2E 0%, #1A237E 50%, #0288D1 100%);
      color: white;
      font-family: system-ui, sans-serif;
      gap: 20px;
    }
    #loading .logo { font-size: 64px; }
    #loading h1 { margin: 0; font-size: 28px; font-weight: 300; letter-spacing: 2px; }
    #loading p { margin: 0; opacity: 0.6; font-size: 14px; }
    #loading .spinner {
      width: 40px; height: 40px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #00B4D8;
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <!-- Splash shown before Flutter initializes -->
  <div id="loading">
    <img src="icons/Icon-192.png" width="84" height="84" style="border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.4);" alt="USA Weather Logo" />
    <h1>USA Weather</h1>
    <p>Weather for USA &amp; Beyond</p>
    <div class="spinner"></div>
  </div>

  <script src="flutter_bootstrap.js" async></script>

  <script>
    // Hide loading screen once Flutter is ready
    window.addEventListener('flutter-first-frame', function() {
      var loading = document.getElementById('loading');
      if (loading) {
        loading.style.transition = 'opacity 0.5s';
        loading.style.opacity = '0';
        setTimeout(function() { loading.remove(); }, 500);
      }
    });
  </script>
</body>
</html>

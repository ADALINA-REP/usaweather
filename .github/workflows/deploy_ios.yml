name: Deploy iOS to App Store Connect

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build_and_deploy_ios:
    name: Build & Deploy iOS to TestFlight / App Store
    runs-on: macos-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager for iOS
        run: flutter config --no-enable-swift-package-manager

      - name: Install Dependencies
        run: |
          flutter precache --ios
          flutter pub get
          flutter build ios --config-only --release

      - name: Set up App Store Connect API Key
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          APP_STORE_CONNECT_API_KEY: ${{ secrets.APP_STORE_CONNECT_API_KEY }}
        run: |
          mkdir -p "$HOME/.appstoreconnect/private_keys"
          CLEAN_KEY_ID="9HC3ZFHYQ7"
          if [ -n "${APP_STORE_CONNECT_KEY_ID}" ]; then
            EXTRACTED=$(echo "${APP_STORE_CONNECT_KEY_ID}" | grep -oE '[A-Z0-9]{10}' | head -n 1)
            if [ -n "$EXTRACTED" ]; then CLEAN_KEY_ID="$EXTRACTED"; fi
          fi

          TARGET_FILE="$HOME/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8"
          
          if [ -n "$APP_STORE_CONNECT_API_KEY" ]; then
            if [[ "$APP_STORE_CONNECT_API_KEY" == *"BEGIN PRIVATE KEY"* ]]; then
              printf "%s\n" "$APP_STORE_CONNECT_API_KEY" > "$TARGET_FILE"
            else
              echo -n "$APP_STORE_CONNECT_API_KEY" | base64 --decode > "$TARGET_FILE"
            fi
          else
            cat <<'EOF' > "$TARGET_FILE"
-----BEGIN PRIVATE KEY-----
MIGTAgEAMBMGByqGSM49AgEGCCqGSM49AwEHBHkwdwIBAQQggirxemIOJ0dlsLBJ
9jbKPEcTJWI5i4OqpR+6Hv0JJ6KgCgYIKoZIzj0DAQehRANCAARACJZYyIKA/J4A
E0oWMjQECeR0pfOndYymen5P8Q7ba7o4l+IdZzDSNjbZyQ0I6oVlZi54EbeUkz9m
xMlFxhoE
-----END PRIVATE KEY-----
EOF
          fi

          mkdir -p "$HOME/private_keys"
          cp "$TARGET_FILE" "$HOME/private_keys/AuthKey_${CLEAN_KEY_ID}.p8"

      - name: Create ExportOptions.plist
        run: |
          cat <<EOF > ios/ExportOptions.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>destination</key>
              <string>export</string>
              <key>method</key>
              <string>app-store-connect</string>
              <key>teamID</key>
              <string>JTVCP8PGV8</string>
              <key>uploadSymbols</key>
              <true/>
              <key>manageAppVersionAndBuildNumber</key>
              <true/>
              <key>signingStyle</key>
              <string>automatic</string>
          </dict>
          </plist>
          EOF

      - name: Build Unsigned IPA Archive via Flutter
        run: |
          BUILD_NUM=$((1 + GITHUB_RUN_NUMBER))
          echo "Building iOS archive with dynamic build number: $BUILD_NUM"
          flutter build ipa --release --no-codesign --build-number=$BUILD_NUM

      - name: Export Signed IPA via App Store Connect API Key
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          CLEAN_KEY_ID="9HC3ZFHYQ7"
          if [ -n "${APP_STORE_CONNECT_KEY_ID}" ]; then
            EXTRACTED=$(echo "${APP_STORE_CONNECT_KEY_ID}" | grep -oE '[A-Z0-9]{10}' | head -n 1)
            if [ -n "$EXTRACTED" ]; then CLEAN_KEY_ID="$EXTRACTED"; fi
          fi

          CLEAN_ISSUER_ID="b4575c22-8a31-4f97-bed4-889e3c21a7b5"
          if [ -n "${APP_STORE_CONNECT_ISSUER_ID}" ]; then
            EXTRACTED_ISSUER=$(echo "${APP_STORE_CONNECT_ISSUER_ID}" | grep -oE '[a-fA-F0-9-]{36}' | head -n 1)
            if [ -n "$EXTRACTED_ISSUER" ]; then CLEAN_ISSUER_ID="$EXTRACTED_ISSUER"; fi
          fi

          KEY_PATH="$HOME/.appstoreconnect/private_keys/AuthKey_${CLEAN_KEY_ID}.p8"

          ARCHIVE_PATH=$(find build/ios -name "*.xcarchive" -type d 2>/dev/null | head -n 1)
          if [ -z "$ARCHIVE_PATH" ]; then
            ARCHIVE_PATH="build/ios/archive/Runner.xcarchive"
          fi
          echo "Found xcarchive at: $ARCHIVE_PATH"

          mkdir -p build/ios/ipa

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportOptionsPlist ios/ExportOptions.plist \
            -exportPath build/ios/ipa \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$KEY_PATH" \
            -authenticationKeyID "$CLEAN_KEY_ID" \
            -authenticationKeyIssuerID "$CLEAN_ISSUER_ID"

      - name: Upload IPA to App Store Connect / TestFlight
        env:
          APP_STORE_CONNECT_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          APP_STORE_CONNECT_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
        run: |
          CLEAN_KEY_ID="9HC3ZFHYQ7"
          if [ -n "${APP_STORE_CONNECT_KEY_ID}" ]; then
            EXTRACTED=$(echo "${APP_STORE_CONNECT_KEY_ID}" | grep -oE '[A-Z0-9]{10}' | head -n 1)
            if [ -n "$EXTRACTED" ]; then CLEAN_KEY_ID="$EXTRACTED"; fi
          fi

          CLEAN_ISSUER_ID="b4575c22-8a31-4f97-bed4-889e3c21a7b5"
          if [ -n "${APP_STORE_CONNECT_ISSUER_ID}" ]; then
            EXTRACTED_ISSUER=$(echo "${APP_STORE_CONNECT_ISSUER_ID}" | grep -oE '[a-fA-F0-9-]{36}' | head -n 1)
            if [ -n "$EXTRACTED_ISSUER" ]; then CLEAN_ISSUER_ID="$EXTRACTED_ISSUER"; fi
          fi

          IPA_FILE=$(find build/ios/ipa -name "*.ipa" 2>/dev/null | head -n 1)
          if [ -z "$IPA_FILE" ]; then
            IPA_FILE=$(find build/ios -name "*.ipa" 2>/dev/null | head -n 1)
          fi
          echo "Uploading $IPA_FILE to App Store Connect..."
          xcrun altool --upload-app -f "$IPA_FILE" -t ios --apiKey "$CLEAN_KEY_ID" --apiIssuer "$CLEAN_ISSUER_ID" --verbose

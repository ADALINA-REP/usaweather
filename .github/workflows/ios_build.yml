name: iOS Build & Release

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App
    runs-on: macos-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java Development Kit
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Disable Swift Package Manager in Flutter
        run: flutter config --no-enable-swift-package-manager

      - name: Precache iOS Artifacts
        run: flutter precache --ios

      - name: Install Dependencies
        run: flutter pub get

      - name: Build iOS App (No Codesign)
        run: flutter build ios --release --no-codesign

      - name: Package iOS IPA & App Bundle
        run: |
          mkdir -p build/ios/iphoneos/Payload
          cp -r build/ios/iphoneos/Runner.app build/ios/iphoneos/Payload/
          cd build/ios/iphoneos
          zip -r usaweather-ios.ipa Payload
          zip -r Runner.app.zip Runner.app

      - name: Upload iOS Build Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: usaweather-ios-build
          path: |
            build/ios/iphoneos/usaweather-ios.ipa
            build/ios/iphoneos/Runner.app.zip
          retention-days: 30
